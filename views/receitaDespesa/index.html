<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Receita x Despesa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#14201d;--muted:#687572;--paper:#f4f6f2;--card:#fff;--line:#dfe6e1;--green:#12715b;--green2:#1b9a76;--red:#d15b4c;--orange:#ec7a32;--shadow:0 14px 40px rgba(25,48,40,.08)}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif} button,input,select{font:inherit}
    .top{padding:25px clamp(20px,4vw,64px);display:flex;align-items:center;gap:18px}.logo{height:38px}.crumb{font-size:13px;color:var(--muted)}h1{font:800 clamp(25px,3vw,38px)/1.1 Manrope;margin:3px 0}.back{margin-left:auto;color:var(--ink);text-decoration:none;border:1px solid var(--line);padding:10px 16px;border-radius:999px;background:#fff}
    main{max-width:1540px;margin:auto;padding:0 clamp(20px,4vw,64px) 60px}.hero{background:linear-gradient(120deg,#102a25,#164c3e);border-radius:26px;padding:30px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:380px;height:380px;border-radius:50%;right:-90px;top:-190px;border:75px solid rgba(255,255,255,.045)}
    .filters{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:12px;position:relative;z-index:1}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#b8cbc5;margin:0 0 7px}.field input,.field select{width:100%;height:45px;border:1px solid rgba(255,255,255,.16);border-radius:11px;padding:0 12px;background:rgba(255,255,255,.09);color:#fff}.field select option{color:#17211f}.go{align-self:end;height:45px;border:0;border-radius:11px;padding:0 23px;background:#f0a365;color:#18221f;font-weight:800;cursor:pointer}.go:hover{background:#ffc18e}
    .status{min-height:39px;padding:13px 3px 5px;color:var(--muted);font-size:14px}.status.err{color:var(--red)}
    .totals{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:22px 0}.total{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 3px 16px rgba(25,48,40,.045)}.total .eyebrow,.company .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:700}.total strong{font:800 clamp(25px,3vw,38px)/1 Manrope;display:block;margin-top:12px}.total small{color:var(--muted);display:block;margin-top:10px}.total.in strong{color:var(--green)}.total.out strong{color:var(--red)}.total.balance{background:#f0a365;border-color:#f0a365}.total.balance .eyebrow,.total.balance small{color:#5e3a20}
    .grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(350px,.75fr);gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 3px 16px rgba(25,48,40,.045)}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:20px}.panel h2{font:800 18px Manrope;margin:0}.panel p{color:var(--muted);font-size:13px;margin:5px 0 0}.legend{display:flex;gap:16px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.chart{height:280px;position:relative}.chart canvas{width:100%;height:100%}
    .rank{display:flex;flex-direction:column;gap:13px}.rank-row{display:grid;grid-template-columns:minmax(110px,1fr) 2fr auto;gap:12px;align-items:center;font-size:13px}.rank-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}.track{height:8px;background:#edf1ee;border-radius:9px;overflow:hidden}.fill{height:100%;border-radius:9px;background:var(--green2)}.rank-value{font-variant-numeric:tabular-nums;font-weight:700}
    .companies-title{display:flex;align-items:end;justify-content:space-between;margin:28px 0 14px}.companies-title h2{font:800 20px Manrope;margin:0}.companies-title span{color:var(--muted);font-size:13px}.companies{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.company{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;transition:.2s}.company:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.company-head{display:flex;align-items:center;gap:11px;margin-bottom:17px}.company-code{width:35px;height:35px;border-radius:10px;background:#e5f2ed;color:var(--green);display:grid;place-items:center;font-weight:800}.company-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric span{font-size:11px;color:var(--muted);display:block}.metric b{font-size:14px;display:block;margin-top:3px}.company-balance{border-top:1px solid var(--line);margin-top:14px;padding-top:13px;display:flex;justify-content:space-between;font-size:13px}.positive{color:var(--green)}.negative{color:var(--red)}
    @media(max-width:1050px){.filters{grid-template-columns:1fr 1fr}.go{width:100%}.grid{grid-template-columns:1fr}.companies{grid-template-columns:repeat(2,1fr)}}@media(max-width:620px){.top{align-items:flex-start}.back{font-size:0}.back:after{content:"←";font-size:18px}.filters,.totals,.companies{grid-template-columns:1fr}.hero{padding:20px}.rank-row{grid-template-columns:90px 1fr auto}.total strong{font-size:28px}}
  </style>
  <link rel="stylesheet" href="/css/responsive-global.css">
</head>
<body>
  <header class="top"><img src="/images/logo.png" class="logo" alt="Exclusiva"><div><div class="crumb">Financeiro / Visão gerencial</div><h1>Receita x Despesa</h1></div><a href="/" class="back">← Central de Acessos</a></header>
  <main>
    <section class="hero"><div class="filters">
      <div class="field"><label>Data inicial</label><input id="dtIni" type="date"></div><div class="field"><label>Data final</label><input id="dtFin" type="date"></div>
      <div class="field"><label>Status</label><select id="status"><option value="TODOS">Todos os títulos</option><option value="ABERTO">Em aberto</option><option value="BAIXADO">Baixados</option></select></div>
      <div class="field"><label>Provisão</label><select id="provisao"><option value="TODAS">Todas</option><option value="N">Somente reais</option><option value="S">Somente provisões</option></select></div>
      <button class="go" id="atualizar">Atualizar painel</button>
    </div></section>
    <div class="status" id="statusMsg"></div>
    <section class="totals"><article class="total in"><div class="eyebrow">Receita total</div><strong id="receita">—</strong><small id="qtdReceita"></small></article><article class="total out"><div class="eyebrow">Despesa total</div><strong id="despesa">—</strong><small id="qtdDespesa"></small></article><article class="total balance"><div class="eyebrow">Saldo do período</div><strong id="saldo">—</strong><small id="margem"></small></article></section>
    <section class="grid"><article class="panel"><div class="panel-head"><div><h2>Evolução financeira</h2><p>Movimentação diária no período selecionado</p></div><div class="legend"><span><i class="dot" style="background:#1b9a76"></i>Receita</span><span><i class="dot" style="background:#d15b4c"></i>Despesa</span></div></div><div class="chart"><canvas id="trend"></canvas></div></article>
      <article class="panel"><div class="panel-head"><div><h2>Saldo por empresa</h2><p>Ranking do maior para o menor resultado</p></div></div><div class="rank" id="ranking"></div></article></section>
    <div class="companies-title"><h2>Desempenho das empresas</h2><span id="companyCount"></span></div><section class="companies" id="companies"></section>
  </main>
  <script>
    const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:2}); const n=new Intl.NumberFormat('pt-BR');
    const $=id=>document.getElementById(id); let state={linhas:[]},storageKey='',savedScrollY=0;
    const stateIds=['dtIni','dtFin','status','provisao'];
    function savePageState(){if(!storageKey)return;const saved={scrollY:window.scrollY};stateIds.forEach(id=>saved[id]=$(id).value);localStorage.setItem(storageKey,JSON.stringify(saved))}
    function restorePageState(){if(!storageKey)return false;try{const saved=JSON.parse(localStorage.getItem(storageKey));if(!saved)return false;stateIds.forEach(id=>{if(saved[id]!=null)$(id).value=saved[id]});savedScrollY=Number(saved.scrollY)||0;return true}catch(e){return false}}
    function iso(d){return d.toISOString().slice(0,10)} function month(){const h=new Date();$('dtIni').value=iso(new Date(h.getFullYear(),h.getMonth(),1));$('dtFin').value=iso(new Date(h.getFullYear(),h.getMonth()+1,0))}
    function aggregate(rows,keyFn){const map=new Map();for(const r of rows){const k=keyFn(r);const x=map.get(k)||{receita:0,despesa:0,qtdReceitas:0,qtdDespesas:0};x.receita+=r.receita;x.despesa+=r.despesa;x.qtdReceitas+=r.qtdReceitas;x.qtdDespesas+=r.qtdDespesas;map.set(k,x)}return map}
    function render(){const rows=state.linhas;const total=[...aggregate(rows,()=>1).values()][0]||{receita:0,despesa:0,qtdReceitas:0,qtdDespesas:0};const saldo=total.receita-total.despesa;$('receita').textContent=brl.format(total.receita);$('despesa').textContent=brl.format(total.despesa);$('saldo').textContent=brl.format(saldo);$('saldo').className=saldo>=0?'positive':'negative';$('qtdReceita').textContent=n.format(total.qtdReceitas)+' lançamentos';$('qtdDespesa').textContent=n.format(total.qtdDespesas)+' lançamentos';$('margem').textContent=total.receita?((saldo/total.receita)*100).toFixed(1).replace('.',',')+'% da receita':'Sem receita no período';
      const companies=aggregate(rows,r=>r.codemp);const names=new Map(rows.map(r=>[r.codemp,r.empresa]));const arr=[...companies].map(([cod,x])=>({cod,nome:names.get(cod),...x,saldo:x.receita-x.despesa})).sort((a,b)=>a.cod-b.cod);$('companyCount').textContent=arr.length+' empresas';const totalCard={cod:'Σ',nome:'Total consolidado',receita:total.receita,despesa:total.despesa,saldo};const cards=[...arr,totalCard];$('companies').innerHTML=cards.map(x=>`<article class="company"><div class="company-head"><div class="company-code">${x.cod}</div><div class="company-name" title="${x.nome}">${x.nome}</div></div><div class="metrics"><div class="metric"><span>Receita</span><b class="positive">${brl.format(x.receita)}</b></div><div class="metric"><span>Despesa</span><b class="negative">${brl.format(x.despesa)}</b></div></div><div class="company-balance"><span>Saldo</span><b class="${x.saldo>=0?'positive':'negative'}">${brl.format(x.saldo)}</b></div></article>`).join('')||'<p>Nenhum movimento encontrado.</p>';
      const rankArr=[...arr].sort((a,b)=>b.saldo-a.saldo);const max=Math.max(1,...rankArr.map(x=>Math.abs(x.saldo)));$('ranking').innerHTML=rankArr.map(x=>`<div class="rank-row"><div class="rank-name" title="${x.nome}">${x.nome}</div><div class="track"><div class="fill" style="width:${Math.max(2,Math.abs(x.saldo)/max*100)}%;background:${x.saldo>=0?'#1b9a76':'#d15b4c'}"></div></div><div class="rank-value ${x.saldo>=0?'positive':'negative'}">${brl.format(x.saldo)}</div></div>`).join(''); drawTrend(rows)}
    function drawTrend(rows){const byDay=aggregate(rows,r=>String(r.dia).slice(0,10));const data=[...byDay].sort((a,b)=>a[0].localeCompare(b[0]));const c=$('trend'),dpr=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const ctx=c.getContext('2d');ctx.scale(dpr,dpr);ctx.clearRect(0,0,w,h);const pad={l:18,r:12,t:12,b:28},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b,max=Math.max(1,...data.flatMap(x=>[x[1].receita,x[1].despesa]));ctx.strokeStyle='#e5ebe7';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke()}function line(field,color){ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineJoin='round';ctx.beginPath();data.forEach(([day,x],i)=>{const px=pad.l+(data.length===1?cw/2:i*cw/(data.length-1)),py=pad.t+ch-(x[field]/max*ch);i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke()}line('receita','#1b9a76');line('despesa','#d15b4c');ctx.fillStyle='#7b8783';ctx.font='11px DM Sans';ctx.textAlign='center';const step=Math.max(1,Math.ceil(data.length/6));data.forEach(([day],i)=>{if(i%step===0||i===data.length-1)ctx.fillText(day.slice(8,10)+'/'+day.slice(5,7),pad.l+(data.length===1?cw/2:i*cw/(data.length-1)),h-7)})}
    async function load(){const msg=$('statusMsg');msg.textContent='Consultando os dados financeiros…';msg.className='status';$('atualizar').disabled=true;try{const q=new URLSearchParams({dt_ini:$('dtIni').value,dt_fin:$('dtFin').value,status:$('status').value,provisao:$('provisao').value});const r=await fetch('/receita-despesa/api/resumo?'+q);const j=await r.json();if(!r.ok||!j.ok)throw new Error(j.erro||'Não foi possível consultar os dados.');state=j;render();msg.textContent=`${n.format(j.linhas.length)} consolidações · atualizado às ${new Date(j.atualizadoEm).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}`}catch(e){msg.textContent=e.message;msg.className='status err'}finally{$('atualizar').disabled=false}}
    async function init(){try{const r=await fetch('/receita-despesa/api/contexto');const j=await r.json();storageKey='receitaDespesa:v1:'+encodeURIComponent(j.usuario||'usuario')}catch(e){storageKey='receitaDespesa:v1:usuario'}if(!restorePageState())month();await load();if(savedScrollY)requestAnimationFrame(()=>window.scrollTo(0,savedScrollY))}
    $('atualizar').addEventListener('click',()=>{savePageState();load()});stateIds.forEach(id=>$(id).addEventListener('change',savePageState));window.addEventListener('beforeunload',savePageState);window.addEventListener('resize',()=>state.linhas.length&&drawTrend(state.linhas));init();
  </script>
</body>
</html>
